<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Monte Carlo step</title><style>
:root{--blue:#174ea6;--ink:#102033;--muted:#667085;--panel:#fff;--border:#d9e1ec;--green:#168a42;--red:#d93025;--grey:#777;--grid:#edf2f7;}
*{box-sizing:border-box} body{margin:0;background:#fff;font-family:Arial, Helvetica, sans-serif;color:var(--ink);} .app{width:100%;height:100%;padding:8px 16px 12px 16px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 6px 10px 6px;border-bottom:1px solid #e5eaf2;background:#fff;}
.heading h2{margin:0;font-size:24px;line-height:1.1;color:#102033;font-weight:800;} .heading p{margin:4px 0 0 0;font-size:13px;color:var(--muted);} 
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;} button{border:1px solid #bfd0ea;border-radius:10px;background:#fff;color:#0f3d8b;font-weight:700;font-size:13px;padding:9px 13px;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap;} button.primary{background:#174ea6;color:#fff;border-color:#174ea6;} button.reset{background:#6d7782;color:#fff;border-color:#6d7782;} .sliderlab{font-size:13px;color:#697386;display:flex;align-items:center;gap:8px;white-space:nowrap;} input[type=range]{width:115px;} .sigval{font-size:13px;color:#697386;min-width:35px;}
.panels{display:grid;grid-template-columns:300px 1fr;gap:10px;margin:0 6px 0 6px;} .panel{background:#fff;border:1px solid var(--border);border-radius:13px;min-height:0;overflow:hidden;} .panel h4{margin:10px 12px 0 12px;font-size:16px;color:#0f172a;} svg{display:block;width:100%;height:100%;}.leftsvg{height:330px}.mainsvg{height:330px}.mh .leftsvg,.mh .mainsvg{height:330px;}
.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 6px 0 6px;} .card{border:1px solid var(--border);border-radius:10px;background:#fff;padding:12px 14px;min-height:91px;} .card h5{margin:0 0 8px 0;font-size:14px;color:#23364f;text-transform:uppercase;}.card .eq{font-family:Georgia,serif;font-size:22px;text-align:center;margin:6px 0;color:#111;}.card p{font-size:13px;color:#536273;margin:0;}.status{font-size:16px;font-weight:700;margin-top:4px}.accept{color:var(--green)}.reject{color:var(--red)}
.axis text{font-size:12px;fill:#0f172a}.axis path,.axis line{stroke:#444}.chain{fill:none;stroke:#777;stroke-width:2}.stored{fill:#999;opacity:.85}.target{fill:#e5e7eb;stroke:#cfcfcf;stroke-width:1.5}.proposalCurve{fill:none;stroke:#111;stroke-width:2}.proposalLine{stroke:#2563eb;stroke-width:3}.currentDot{fill:#2563eb}.proposalDot{fill:#168a42}.rejectDot{fill:#d93025}.smalllabel{font-size:14px;fill:#111}.grid{stroke:#edf2f7;stroke-width:1}.currentLine{stroke:#2563eb;stroke-width:3}.proposalDash{stroke:#168a42;stroke-width:2.5;stroke-dasharray:4 4}.rejectDash{stroke:#d93025;stroke-width:2.5;stroke-dasharray:4 4}
@media(max-width:800px){.topbar{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}.panels{grid-template-columns:260px 1fr}.leftsvg,.mainsvg{height:315px}.heading h2{font-size:22px}button{padding:7px 9px;font-size:12px}}
</style></head><body><div class='app '><div class='topbar'><div class='heading'><h2>Monte Carlo step</h2><p>Draw random values from a distribution and watch the stored sample fill in.</p></div><div class='controls'><button class='primary' id='one'>Take one step</button><button id='many50'>Run 50 steps</button><button id='many100'>Run 100 steps</button><button id='many200'>Run 200 steps</button><button class='reset' id='reset'>Reset</button><span class='sliderlab'>proposal σ <input id='sig' type='range' min='0.02' max='0.20' step='0.01' value='0.08'><span class='sigval' id='sigv'>0.08</span></span></div></div><div class='panels'><div class='panel'><h4>Density of stored samples</h4><svg id='left' class='leftsvg'></svg></div><div class='panel'><svg id='main' class='mainsvg'></svg></div></div></div><script>
const ns='http://www.w3.org/2000/svg';
function el(name, attrs={}, parent=null){const e=document.createElementNS(ns,name); for(const [k,v] of Object.entries(attrs)){ if(k==='text') e.textContent=v; else e.setAttribute(k,v);} if(parent) parent.appendChild(e); return e;}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);} 
function betaShape(t){ if(t<=0||t>=1)return 0; const a=6,b=4; return Math.pow(t,a-1)*Math.pow(1-t,b-1); }
function normalShape(y,mu,sd){ return Math.exp(-0.5*Math.pow((y-mu)/sd,2)); }
function setupSvg(svg,w,h){svg.setAttribute('viewBox',`0 0 ${w} ${h}`); while(svg.firstChild) svg.removeChild(svg.firstChild);}
function yScale(t,h,top=28,bottom=36){return top+(1-t)*(h-top-bottom);} 
function xScale(i,total,w,left=56,right=46){ if(total<=1)return left; return left + i/(total-1)*(w-left-right); }
function drawYAxis(g,x,h,top=62,bottom=42){el('line',{x1:x,y1:top,x2:x,y2:h-bottom,stroke:'#444','stroke-width':1.5},g); for(let v=0;v<=1.0001;v+=0.2){let y=yScale(v,h,top,bottom); el('line',{x1:x,y1:y,x2:x+7,y2:y,stroke:'#444','stroke-width':1.3},g); let txt=(v===0?'0':v===1?'1':String(Math.round(v*10)/10).replace('0.',' .')); el('text',{x:x+14,y:y+4,text:txt,'font-size':14,fill:'#111'},g);} }
function rgamma(k){let d=k-1/3,c=1/Math.sqrt(9*d);while(true){let x=randn(),v=Math.pow(1+c*x,3);if(v<=0)continue;let u=Math.random();if(u<1-0.0331*Math.pow(x,4))return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function rbeta(a,b){let x=rgamma(a),y=rgamma(b);return x/(x+y)}
function posterior(t){return betaShape(t)}
function drawLeft(svg, draws, current, proposal, rejected=false){const W=300,H=330; setupSvg(svg,W,H); const bottom=42, axisX=244, top=50; drawYAxis(svg,axisX,H,top,bottom); el('line',{x1:36,y1:H-bottom,x2:axisX,y2:H-bottom,stroke:'#555','stroke-width':1.5},svg); el('text',{x:95,y:H-9,text:'relative frequency','font-size':14,fill:'#111'},svg);
 let pts=[]; for(let i=0;i<=160;i++){let t=i/160; let y=yScale(t,H,top,bottom); let dens=betaShape(t); pts.push([axisX-dens*8600,y]);} let path=`M ${axisX} ${yScale(0,H,top,bottom)} `+pts.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${axisX} ${yScale(1,H,top,bottom)} Z`; el('path',{d:path,class:'target'},svg);
 if(draws.length){let bins=22, counts=Array(bins).fill(0); draws.forEach(d=>{let k=Math.max(0,Math.min(bins-1,Math.floor(d*bins))); counts[k]++}); let maxc=Math.max(1,...counts); for(let k=0;k<bins;k++){let t0=k/bins,t1=(k+1)/bins; let y0=yScale(t0,H,top,bottom), y1=yScale(t1,H,top,bottom); let bh=Math.abs(y1-y0)-2; let w=counts[k]/maxc*145; if(w>0) el('rect',{x:axisX-w,y:Math.min(y0,y1)+1,width:w,height:bh,class:'stored'},svg);} }
 if(current!==null && current!==undefined){let y=yScale(current,H,top,bottom); el('line',{x1:36,y1:y,x2:axisX,y2:y,class:'currentLine'},svg); el('circle',{cx:axisX,cy:y,r:7,class:'currentDot'},svg);} if(proposal!==null && proposal!==undefined){let y=yScale(proposal,H,top,bottom); el('line',{x1:36,y1:y,x2:axisX,y2:y,class:rejected?'rejectDash':'proposalDash'},svg); el('circle',{cx:axisX,cy:y,r:7,class:rejected?'rejectDot':'proposalDot'},svg);} }
function visibleSlice(arr, visibleMax){return arr.length<=visibleMax ? arr : arr.slice(arr.length-visibleMax)}
function drawMain(svg, chain, current, proposal, sigma, mode, accepted=null){const W=880,H=330; setupSvg(svg,W,H); const left=54,right=130,top=35,bottom=44,visibleMax=500; el('text',{x:W/2,y:28,text: mode==='mc'?'Monte Carlo draws': mode==='markov'?'Markov chain iteration':'MCMC iteration','font-size':16,'text-anchor':'middle',fill:'#111'},svg); el('line',{x1:left,y1:top,x2:left,y2:H-bottom,stroke:'#555','stroke-width':1.5},svg); for(let v=0;v<=1.0001;v+=0.2){let y=yScale(v,H,top,bottom); el('line',{x1:left,y1:y,x2:W-right,y2:y,class:'grid'},svg); el('line',{x1:left-6,y1:y,x2:left,y2:y,stroke:'#555','stroke-width':1.3},svg); let txt=(v===0?'0':v===1?'1':String(Math.round(v*10)/10).replace('0.',' .')); el('text',{x:left-20,y:y+4,text:txt,'font-size':14,fill:'#111'},svg);} el('line',{x1:left,y1:H-bottom,x2:W-right,y2:H-bottom,stroke:'#555','stroke-width':1.5},svg); el('text',{x:left-38,y:H/2,text:'θ','font-size':18,fill:'#111',transform:`rotate(-90 ${left-38} ${H/2})`},svg);
 const shown=chain.length<=visibleMax ? chain : chain.slice(chain.length-visibleMax); const total=visibleMax; if(mode==='mc'){ shown.forEach((d,i)=>{el('circle',{cx:xScale(i,total,W,left,right),cy:yScale(d,H,top,bottom),r:3.2,fill:'#777',opacity:0.48},svg);}); if(current!==null) el('circle',{cx:xScale(Math.max(0,shown.length-1),total,W,left,right),cy:yScale(current,H,top,bottom),r:5,fill:'#2563eb'},svg); }
 else { if(shown.length>1){let d=''; shown.forEach((v,i)=>{d+=(i?'L':'M')+xScale(i,total,W,left,right)+' '+yScale(v,H,top,bottom)+' ';}); el('path',{d:d,class:'chain'},svg);} if(shown.length){el('circle',{cx:xScale(shown.length-1,total,W,left,right),cy:yScale(shown[shown.length-1],H,top,bottom),r:5,fill:'#2563eb'},svg);} }
 if(mode!=='mc'){ const axisX=W-right+35; el('line',{x1:axisX,y1:top,x2:axisX,y2:H-bottom,stroke:'#111','stroke-width':1.5},svg); let pts=[]; for(let i=0;i<=120;i++){let t=i/120; let y=yScale(t,H,top,bottom); let density=normalShape(t,current,sigma); pts.push([axisX+density*65,y]);} el('path',{d:pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '),class:'proposalCurve'},svg); let cy=yScale(current,H,top,bottom); el('line',{x1:axisX,y1:cy,x2:axisX+70,y2:cy,class:'proposalLine'},svg); el('circle',{cx:axisX+70,cy:cy,r:7,class:'currentDot'},svg); el('text',{x:axisX+84,y:cy+5,text:`N(${current.toFixed(2)}, σ)`,class:'smalllabel'},svg); if(proposal!==null){let py=yScale(proposal,H,top,bottom); el('circle',{cx:axisX+35,cy:py,r:7,class:accepted===false?'rejectDot':'proposalDot'},svg); el('line',{x1:axisX+35,y1:py,x2:axisX+35,y2:cy,stroke:accepted===false?'#d93025':'#168a42','stroke-width':2,'stroke-dasharray':'4 4'},svg);} }
}
function boundedProposal(mu, sd){let p=mu+randn()*sd; let tries=0; while((p<=0||p>=1)&&tries<50){p=mu+randn()*sd; tries++;} return clamp(p,0.001,0.999);}

let draws=[], chain=[], current=0.50, proposal=null, sigma=0.08, lastAccepted=null, lastR=null, lastAlpha=null, lastU=null;
const left=document.getElementById('left'), main=document.getElementById('main'), sig=document.getElementById('sig'), sigv=document.getElementById('sigv');
function redraw(){sigv.textContent=Number(sig.value).toFixed(2); drawLeft(left,draws,current,proposal,lastAccepted===false); drawMain(main,chain,current,proposal,sigma,'mc',lastAccepted); }
function step(){
  if('mc'==='mc'){ current=rbeta(6,4); chain.push(current); draws.push(current); proposal=null; lastAccepted=true; }
  else if('mc'==='markov'){ proposal=boundedProposal(current,sigma); current=proposal; chain.push(current); draws.push(current); lastAccepted=true; }
  else { proposal=boundedProposal(current,sigma); const r=posterior(proposal)/posterior(current); const alpha=Math.min(1,r); const u=Math.random(); lastR=r; lastAlpha=alpha; lastU=u; lastAccepted=(u<alpha); if(lastAccepted) current=proposal; chain.push(current); draws.push(current); }
  if(chain.length>2000) chain=chain.slice(-2000); if(draws.length>2000) draws=draws.slice(-2000); redraw();
}
function many(n){let i=0;function go(){step(); if(++i<n)setTimeout(go,18);}go();}
function resetAll(){draws=[]; chain=[]; current=0.50; proposal=null; lastAccepted=null; lastR=null; lastAlpha=null; lastU=null; if('mc'!=='mc'){chain=[current]; draws=[current];} redraw();}
function updateCards(){
 const rt=document.getElementById('ratioText'), at=document.getElementById('alphaText'), dt=document.getElementById('decisionText'), st=document.getElementById('statusText');
 if(!rt) return; if(lastR===null){rt.textContent='Take one step to propose θ* and calculate the ratio.'; at.textContent='The algorithm will use α = min(1, r).'; dt.textContent='Then draw u from Uniform(0, 1).'; st.textContent=''; st.className='status'; return;}
 rt.textContent=`r = ${lastR.toFixed(3)}. This compares the proposed value with the current value.`;
 at.textContent=`α = min(1, r) = ${lastAlpha.toFixed(3)}.`;
 dt.textContent=`u = ${lastU.toFixed(3)}. Accept if u < α.`;
 st.textContent= lastAccepted ? 'Move accepted' : 'Move rejected'; st.className='status '+(lastAccepted?'accept':'reject');
}
document.getElementById('one').onclick=()=>step(); document.getElementById('many50').onclick=()=>many(50); document.getElementById('many100').onclick=()=>many(100); document.getElementById('many200').onclick=()=>many(200); document.getElementById('reset').onclick=()=>resetAll(); sig.oninput=()=>{sigma=Number(sig.value);redraw();}; resetAll();
</script></body></html>
