<div id="sampling-animation-app" class="sampling-animation-app">
  <style>
    .sampling-animation-app {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 920px;
      height: 720px;
      border: 1px solid #d8d8b8;
      border-radius: 14px;
      padding: 12px 14px 10px 14px;
      box-sizing: border-box;
      background: #fffbd1;
      color: #222;
      overflow: hidden;
    }

    .sampling-animation-app .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .sampling-animation-app h3 {
      margin: 0 0 3px 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sampling-animation-app p {
      margin: 0;
      font-size: 13px;
      line-height: 1.35;
      color: #555;
    }

    .sampling-animation-app .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: flex-end;
      align-items: center;
    }

    .sampling-animation-app button {
      border: 1px solid #8f8f8f;
      background: #ffffff;
      color: #222;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
    }

    .sampling-animation-app button:hover { background: #f2f2f2; }
    .sampling-animation-app button:disabled { opacity: 0.55; cursor: not-allowed; }

    .sampling-animation-app .small-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #333;
      background: rgba(255,255,255,0.6);
      border: 1px solid #e0ddb0;
      border-radius: 8px;
      padding: 4px 6px;
    }

    .sampling-animation-app input {
      width: 58px;
      border: 1px solid #aaa;
      border-radius: 6px;
      padding: 4px 5px;
      font-size: 12px;
      background: white;
    }

    .sampling-animation-app .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 4px;
    }

    .sampling-animation-app .stat-card {
      background: rgba(255,255,255,0.62);
      border: 1px solid #ebe7b5;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.25;
    }

    .sampling-animation-app .stat-card strong {
      display: block;
      font-size: 15px;
      margin-top: 2px;
      color: #111;
    }

    .sampling-animation-app svg {
      width: 100%;
      height: 570px;
      display: block;
      background: #fffbd1;
    }

    .sampling-animation-app .axis-line { stroke: #333; stroke-width: 1; }
    .sampling-animation-app .tick { stroke: #333; stroke-width: 1; }
    .sampling-animation-app .tick-minor { stroke: #333; stroke-width: 0.65; opacity: 0.55; }
    .sampling-animation-app .grid-line { stroke: #e8e3ab; stroke-width: 1; }
    .sampling-animation-app .label { font-size: 12px; fill: #333; }
    .sampling-animation-app .title { font-size: 14px; font-weight: 700; fill: #111; }
    .sampling-animation-app .note { font-size: 11px; fill: #555; }
    .sampling-animation-app .hist-bin { fill: #4a4a4a; opacity: 0.96; }
    .sampling-animation-app .sample-dot { fill: #444; opacity: 0.95; }
    .sampling-animation-app .fall-dot { fill: #444; stroke: white; stroke-width: 1; opacity: 0.95; }
    .sampling-animation-app .mean-dot { fill: #0a43ff; stroke: white; stroke-width: 0.8; opacity: 0.88; }
    .sampling-animation-app .density-bin { fill: #4a4a4a; opacity: 0.88; }
    .sampling-animation-app .density-axis { stroke: #333; stroke-width: 1; }
    .sampling-animation-app .fall-mean { fill: #0a43ff; stroke: white; stroke-width: 1; }
    .sampling-animation-app .mean-line { stroke: #0a43ff; stroke-width: 2; stroke-dasharray: 5 4; }
    .sampling-animation-app .true-line { stroke: #bb2b2b; stroke-width: 1.4; stroke-dasharray: 4 4; }
    .sampling-animation-app .bracket { stroke: #bf3030; stroke-width: 1.2; fill: none; }

    @media (max-width: 720px) {
      .sampling-animation-app { height: 780px; }
      .sampling-animation-app .top-row { flex-direction: column; }
      .sampling-animation-app .controls { justify-content: flex-start; }
      .sampling-animation-app .stats { grid-template-columns: repeat(2, 1fr); }
      .sampling-animation-app svg { height: 600px; }
    }
  </style>

  <div class="top-row">
    <div>
      <h3>Building a sampling distribution</h3>
      <p>Draw 10 household incomes. Their mean then drops into the sampling distribution below. As more means accumulate, the bottom panel is shown as a density histogram.</p>
    </div>
    <div class="controls">
      <button type="button" id="take-sample">Take sample</button>
      <div class="small-control">
        Repeat
        <input id="many-n" type="number" min="1" max="1000" step="1" value="100">
      </div>
      <button type="button" id="take-many">Take many</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">Sample size<strong>10</strong></div>
    <div class="stat-card">Samples taken<strong id="samples-taken">0</strong></div>
    <div class="stat-card">Latest sample mean<strong id="latest-mean">-</strong></div>
    <div class="stat-card">Mean of sample means<strong id="mean-of-means">-</strong></div>
  </div>

  <svg id="sampling-svg" viewBox="0 0 900 570" role="img" aria-label="Animated sampling distribution app"></svg>

  <script>
    (function () {
      const root = document.getElementById("sampling-animation-app");
      const svg = root.querySelector("#sampling-svg");
      const takeSampleButton = root.querySelector("#take-sample");
      const takeManyButton = root.querySelector("#take-many");
      const resetButton = root.querySelector("#reset");
      const manyInput = root.querySelector("#many-n");

      const width = 900;
      const height = 570;
      const margin = { left: 58, right: 28 };
      const plotWidth = width - margin.left - margin.right;
      const minX = 0;
      const maxX = 280000;
      const sampleSize = 10;
      const meanlog = Math.log(85000);
      const sdlog = 0.55;
      const trueMean = Math.exp(meanlog + 0.5 * sdlog * sdlog);

      const populationY = 35;
      const populationH = 95;
      const sampleY = 225;
      const sampleH = 80;
      const meansY = 405;
      const meansH = 100;
      const axisOffset = 13;

      let latestSample = [];
      let sampleMeans = [];
      let animating = false;
      let populationBins = makePopulationBins();

      function randn() {
        let u = 0;
        let v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }

      function rlnorm() {
        return Math.exp(meanlog + sdlog * randn());
      }

      function formatDollar(x) {
        if (!isFinite(x)) return "-";
        return "$" + Math.round(x).toLocaleString("en-AU");
      }

      function xScale(x) {
        return margin.left + ((x - minX) / (maxX - minX)) * plotWidth;
      }

      function clamp(x, lo, hi) {
        return Math.min(Math.max(x, lo), hi);
      }

      function svgEl(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.keys(attrs || {}).forEach(k => el.setAttribute(k, attrs[k]));
        return el;
      }

      function addText(text, x, y, cls, anchor) {
        const el = svgEl("text", {
          x, y,
          class: cls || "label",
          "text-anchor": anchor || "start"
        });
        el.textContent = text;
        svg.appendChild(el);
        return el;
      }

      function makePopulationBins() {
        const bins = 46;
        const counts = Array(bins).fill(0);
        const values = [];
        for (let i = 0; i < 50000; i++) {
          const v = clamp(rlnorm(), minX, maxX * 0.995);
          values.push(v);
          const b = clamp(Math.floor(((v - minX) / (maxX - minX)) * bins), 0, bins - 1);
          counts[b] += 1;
        }
        return { bins, counts, values, maxCount: Math.max.apply(null, counts) };
      }

      function drawAxis(y, label, showMinor) {
        svg.appendChild(svgEl("line", {
          x1: margin.left, y1: y,
          x2: width - margin.right, y2: y,
          class: "axis-line"
        }));
        const majors = [0, 50000, 100000, 150000, 200000, 250000];
        if (showMinor) {
          for (let t = 0; t <= maxX; t += 10000) {
            const x = xScale(t);
            svg.appendChild(svgEl("line", { x1: x, y1: y, x2: x, y2: y + 4, class: "tick-minor" }));
          }
        }
        majors.forEach(t => {
          const x = xScale(t);
          svg.appendChild(svgEl("line", { x1: x, y1: y, x2: x, y2: y + 7, class: "tick" }));
          addText("$" + (t / 1000) + "k", x, y + 22, "label", "middle");
        });
        addText(label, margin.left, y + 36, "note", "start");
      }

      function drawPopulation() {
        const binW = plotWidth / populationBins.bins;
        for (let i = 0; i < populationBins.bins; i++) {
          const h = (populationBins.counts[i] / populationBins.maxCount) * (populationH - 16);
          const x = margin.left + i * binW;
          const y = populationY + populationH - h;
          svg.appendChild(svgEl("rect", {
            x: x + 0.5,
            y,
            width: Math.max(1, binW - 1),
            height: h,
            class: "hist-bin"
          }));
        }
        const bx1 = xScale(100000);
        const bx2 = xScale(180000);
        const by = populationY + populationH + 13;
        svg.appendChild(svgEl("path", { d: `M ${bx1} ${by} L ${bx1} ${by + 8} L ${bx2} ${by + 8} L ${bx2} ${by}`, class: "bracket" }));
      }

      function yOnPopulation(value) {
        const bin = clamp(Math.floor(((value - minX) / (maxX - minX)) * populationBins.bins), 0, populationBins.bins - 1);
        const h = (populationBins.counts[bin] / populationBins.maxCount) * (populationH - 16);
        const top = populationY + populationH - h;
        return top + Math.random() * Math.max(4, h * 0.65);
      }

      function drawBase() {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        addText("Parent population of household incomes", margin.left, 16, "title");
        addText("Sample data", margin.left, sampleY - 14, "title");
        addText("Sampling distribution of sample means, n = 10", margin.left, meansY - 14, "title");
        drawPopulation();
        drawAxis(populationY + populationH + axisOffset, "Annual household income", true);
        drawAxis(sampleY + sampleH + axisOffset, "Household income in the latest sample", true);
        drawAxis(meansY + meansH + axisOffset, "Sample mean income", true);

      }

      function drawStaticSample() {
        if (!latestSample.length) return;
        const mean = latestSample.reduce((a, b) => a + b, 0) / latestSample.length;
        svg.appendChild(svgEl("line", {
          x1: xScale(mean), y1: sampleY,
          x2: xScale(mean), y2: sampleY + sampleH + axisOffset,
          class: "mean-line"
        }));
        addText("sample mean", xScale(mean) + 6, sampleY + 13, "note");
        latestSample.forEach((d, i) => {
          svg.appendChild(svgEl("circle", {
            cx: xScale(d),
            cy: sampleDotY(i, d),
            r: 5,
            class: "sample-dot"
          }));
        });
      }

      function getDensityBins(skipLast) {
        const values = skipLast ? sampleMeans.slice(0, -1) : sampleMeans.slice();
        const bins = 34;
        const counts = Array(bins).fill(0);
        const binWidth = (maxX - minX) / bins;

        values.forEach(m => {
          const b = clamp(Math.floor((m - minX) / binWidth), 0, bins - 1);
          counts[b] += 1;
        });

        const densities = counts.map(c => values.length ? c / (values.length * binWidth) : 0);
        const maxDensity = Math.max(0.000001, ...densities);
        return { values, bins, counts, densities, binWidth, maxDensity };
      }

      function densityY(d, maxDensity) {
        const bottom = meansY + meansH;
        const plotH = meansH - 12;
        return bottom - (d / maxDensity) * plotH;
      }

      function formatDensity(d) {
        if (d === 0) return "0";
        return d.toExponential(1);
      }

      function drawDensityAxis(maxDensity) {
        const bottom = meansY + meansH;
        const top = meansY + 4;
        const x = margin.left;

        svg.appendChild(svgEl("line", {
          x1: x, y1: top,
          x2: x, y2: bottom,
          class: "density-axis"
        }));

        [0, maxDensity / 2, maxDensity].forEach(d => {
          const y = densityY(d, maxDensity);
          svg.appendChild(svgEl("line", { x1: x - 5, y1: y, x2: x, y2: y, class: "tick" }));
          addText(formatDensity(d), x - 8, y + 4, "label", "end");
        });

        const label = svgEl("text", {
          x: 16,
          y: meansY + meansH / 2,
          class: "note",
          "text-anchor": "middle",
          transform: `rotate(-90 16 ${meansY + meansH / 2})`
        });
        label.textContent = "Probability density";
        svg.appendChild(label);
      }

      function drawSamplingDistribution(skipLast) {
        const d = getDensityBins(skipLast);
        drawDensityAxis(d.maxDensity);

        if (!d.values.length) {
          addText("Sample means will build up here", margin.left + 12, meansY + 34, "note");
          return;
        }

        const barGap = 1;
        for (let i = 0; i < d.bins; i++) {
          if (d.counts[i] === 0) continue;
          const x0 = margin.left + i * (plotWidth / d.bins);
          const y = densityY(d.densities[i], d.maxDensity);
          const bottom = meansY + meansH;
          svg.appendChild(svgEl("rect", {
            x: x0 + barGap / 2,
            y: y,
            width: Math.max(1, plotWidth / d.bins - barGap),
            height: bottom - y,
            class: "density-bin"
          }));
        }

      }

      function sampleDotY(i, value) {
        const lane = i % 6;
        return sampleY + sampleH + 5 - lane * 10;
      }

      function render() {
        drawBase();
        drawStaticSample();
        drawSamplingDistribution(false);
        updateStats();
      }

      function updateStats() {
        const latestMean = sampleMeans.length ? sampleMeans[sampleMeans.length - 1] : NaN;
        const meanOfMeans = sampleMeans.length ? sampleMeans.reduce((a, b) => a + b, 0) / sampleMeans.length : NaN;
        root.querySelector("#samples-taken").textContent = sampleMeans.length.toLocaleString("en-AU");
        root.querySelector("#latest-mean").textContent = formatDollar(latestMean);
        root.querySelector("#mean-of-means").textContent = formatDollar(meanOfMeans);
      }

      function setButtons(disabled) {
        animating = disabled;
        takeSampleButton.disabled = disabled;
        takeManyButton.disabled = disabled;
        resetButton.disabled = disabled;
        manyInput.disabled = disabled;
      }

      function drawSample() {
        const sample = [];
        for (let i = 0; i < sampleSize; i++) sample.push(clamp(rlnorm(), minX, maxX * 0.98));
        return sample;
      }

      function animateOneSample(extraFast) {
        if (animating) return Promise.resolve();
        setButtons(true);

        latestSample = drawSample();
        const mean = latestSample.reduce((a, b) => a + b, 0) / sampleSize;
        sampleMeans.push(mean);

        drawBase();
        drawSamplingDistribution(true);

        const start = latestSample.map(v => ({ x: xScale(v), y: yOnPopulation(v) }));
        const end = latestSample.map((v, i) => ({ x: xScale(v), y: sampleDotY(i, v) }));
        const points = latestSample.map((v, i) => {
          const c = svgEl("circle", { cx: start[i].x, cy: start[i].y, r: 5, class: "fall-dot" });
          svg.appendChild(c);
          return c;
        });

        const meanStart = { x: xScale(mean), y: sampleY + sampleH + axisOffset + 10 };
        const meanEnd = { x: xScale(mean), y: meansY + meansH + 5 };

        const duration1 = extraFast ? 170 : 650;
        const duration2 = extraFast ? 170 : 550;

        return new Promise(resolve => {
          const startTime = performance.now();
          function ease(t) { return 1 - Math.pow(1 - t, 3); }
          function step(now) {
            const p = Math.min(1, (now - startTime) / duration1);
            const e = ease(p);
            points.forEach((c, i) => {
              const x = start[i].x + (end[i].x - start[i].x) * e;
              const y = start[i].y + (end[i].y - start[i].y) * e;
              c.setAttribute("cx", x);
              c.setAttribute("cy", y);
            });
            if (p < 1) {
              requestAnimationFrame(step);
            } else {
              points.forEach((c, i) => {
                c.setAttribute("class", "sample-dot");
                c.setAttribute("cx", end[i].x);
                c.setAttribute("cy", end[i].y);
              });
              svg.appendChild(svgEl("line", {
                x1: xScale(mean), y1: sampleY,
                x2: xScale(mean), y2: sampleY + sampleH + axisOffset,
                class: "mean-line"
              }));
              addText("sample mean", xScale(mean) + 6, sampleY + 13, "note");

              const m = svgEl("circle", { cx: meanStart.x, cy: meanStart.y, r: 5, class: "fall-mean" });
              svg.appendChild(m);
              const startTime2 = performance.now();
              function step2(now2) {
                const p2 = Math.min(1, (now2 - startTime2) / duration2);
                const e2 = ease(p2);
                const x = meanStart.x + (meanEnd.x - meanStart.x) * e2;
                const y = meanStart.y + (meanEnd.y - meanStart.y) * e2;
                m.setAttribute("cx", x);
                m.setAttribute("cy", y);
                if (p2 < 1) {
                  requestAnimationFrame(step2);
                } else {
                  updateStats();
                  setButtons(false);
                  render();
                  resolve();
                }
              }
              requestAnimationFrame(step2);
            }
          }
          requestAnimationFrame(step);
        });
      }

      function takeManyFast(n) {
        if (animating) return;
        setButtons(true);
        const last = drawSample();
        for (let j = 0; j < n; j++) {
          const sample = (j === n - 1) ? last : drawSample();
          const mean = sample.reduce((a, b) => a + b, 0) / sampleSize;
          sampleMeans.push(mean);
          latestSample = sample;
        }
        render();
        setButtons(false);
      }

      takeSampleButton.addEventListener("click", () => animateOneSample(false));
      takeManyButton.addEventListener("click", () => {
        let n = parseInt(manyInput.value, 10);
        if (!isFinite(n)) n = 100;
        n = clamp(n, 1, 1000);
        manyInput.value = n;
        takeManyFast(n);
      });
      resetButton.addEventListener("click", () => {
        latestSample = [];
        sampleMeans = [];
        render();
      });

      render();
    })();
  </script>
</div>
