<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Random-walk Metropolis MCMC Demo</title>
<style>
  :root{
    --ink:#202124;
    --muted:#687076;
    --panel:#ffffff;
    --line:#d8dde3;
    --blue:#2454d6;
    --green:#188038;
    --red:#d93025;
    --grey:#6f6f6f;
    --soft:#f7f8fa;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f7f8fa;
    color:var(--ink);
  }
  .mcmc-app{
    max-width:1180px;
    margin:0 auto;
    padding:8px;
    overflow:hidden;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .title h2{margin:0;font-size:22px;line-height:1.15;}
  .title p{margin:3px 0 0;color:var(--muted);font-size:13px;}
  .controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;}
  button{
    border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;
    background:#153e90;color:white;box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  button.secondary{background:#68717a;}
  button.ghost{background:white;color:#153e90;border:1px solid #b9c7e8;box-shadow:none;}
  button:active{transform:translateY(1px)}
  label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  input[type="range"]{width:120px;}
  .grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:10px;align-items:stretch;}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .panel h3{margin:0 0 4px;font-size:14px;}
  svg{display:block;width:100%;height:300px;}
  .legend{display:none;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
  .blue{background:var(--blue)} .green{background:var(--green)} .red{background:var(--red)} .grey{background:var(--grey)}
  .readout{display:none;}
  .readout .muted{color:var(--muted)}
  @media (max-width:620px){
    .topbar{display:block}.controls{justify-content:flex-start;margin-top:8px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="mcmc-app">
  <div class="topbar">
    <div class="title">
      <h2>Random walk proposal</h2>
      <p>Each step proposes a nearby value from a normal distribution centred at the current value.</p>
    </div>
    <div class="controls">
      <button id="stepBtn">Take one step</button>
      <button id="runBtn" class="ghost">Run 50 steps</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <label>proposal σ <input id="sdSlider" type="range" min="0.02" max="0.22" step="0.01" value="0.08"><span id="sdVal">0.08</span></label>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h3>Density of stored samples</h3>
      <svg id="densitySvg" viewBox="0 0 290 300" aria-label="Flipped density plot of stored MCMC samples"></svg>
      <div class="legend">
        <span><span class="dot grey"></span>stored samples</span>
        <span><span class="dot blue"></span>current</span>
        <span><span class="dot green"></span>proposal</span>
        <span><span class="dot red"></span>rejected</span>
      </div>
    </div>

    <div class="panel">
      <h3>MCMC iteration</h3>
      <svg id="chainSvg" viewBox="0 0 860 300" aria-label="MCMC chain and proposal distribution"></svg>
      <div class="legend">
        <span><span class="dot grey"></span>stored chain</span>
        <span><span class="dot blue"></span>proposal distribution centred at current value</span>
      </div>
    </div>
  </div>

  <div class="readout" id="readout">Ready. The chain starts at θ = 0.500.</div>
</div>

<script>
(function(){
  const densitySvg = document.getElementById('densitySvg');
  const chainSvg = document.getElementById('chainSvg');
  const stepBtn = document.getElementById('stepBtn');
  const runBtn = document.getElementById('runBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sdSlider = document.getElementById('sdSlider');
  const sdVal = document.getElementById('sdVal');
  const readout = document.getElementById('readout');

  const Wd = 290, Hd = 300, Wc = 860, Hc = 300;
  const dm = {l:18, r:48, t:18, b:28};
  const cm = {l:42, r:18, t:16, b:28};

  // Target posterior used for the accept/reject rule: Beta(5, 7).
  const alphaPost = 5, betaPost = 7;
  let sigma = Number(sdSlider.value);
  let chain = [0.5];
  let last = null;
  let acceptedCount = 0;
  let running = false;

  function betaUnnorm(x){
    if(x <= 0 || x >= 1) return 0;
    return Math.pow(x, alphaPost - 1) * Math.pow(1 - x, betaPost - 1);
  }
  function randn(){
    let u = 0, v = 0;
    while(u === 0) u = Math.random();
    while(v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function normalPdf(z, mu, sd){
    return Math.exp(-0.5 * Math.pow((z - mu) / sd, 2));
  }
  function clamp01(x){return Math.max(0, Math.min(1, x));}
  function el(name, attrs = {}){
    const e = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
    return e;
  }
  function line(svg, x1, y1, x2, y2, stroke = '#333', sw = 1, extra = {}){
    const e = el('line', {x1,y1,x2,y2,stroke,'stroke-width':sw,...extra});
    svg.appendChild(e); return e;
  }
  function path(svg, d, attrs = {}){
    const e = el('path', {d, fill:'none', stroke:'#333', 'stroke-width':1.5, ...attrs});
    svg.appendChild(e); return e;
  }
  function circle(svg, cx, cy, r, fill, attrs = {}){
    const e = el('circle', {cx, cy, r, fill, stroke:'white', 'stroke-width':1.5, ...attrs});
    svg.appendChild(e); return e;
  }
  function text(svg, x, y, str, attrs = {}){
    const e = el('text', {x, y, 'font-size':attrs.size || 12, fill:attrs.fill || '#333', 'text-anchor':attrs.anchor || 'middle', 'font-family':'system-ui, sans-serif', ...attrs});
    e.textContent = str; svg.appendChild(e); return e;
  }

  function yDen(theta){
    return Hd - dm.b - theta * (Hd - dm.t - dm.b);
  }
  function densityAxisX(){
    return Wd - dm.r;
  }
  function yChain(theta){
    return Hc - cm.b - theta * (Hc - cm.t - cm.b);
  }
  function xChain(i){
    const nMax = Math.max(60, chain.length + 10);
    return cm.l + (i / (nMax - 1)) * (Wc - cm.l - cm.r);
  }

  function drawDensityAxes(){
    densitySvg.innerHTML = '';
    const ax = densityAxisX();
    line(densitySvg, ax, dm.t, ax, Hd - dm.b, '#333', 1.2);
    line(densitySvg, dm.l, Hd - dm.b, ax, Hd - dm.b, '#333', 1.2);
    for(let k = 0; k <= 10; k++){
      const v = k / 10;
      const y = yDen(v);
      line(densitySvg, ax, y, ax + 5, y, '#333', 1);
      if(k % 2 === 0 || k === 10){
        const lab = v.toFixed(v === 0 || v === 1 ? 0 : 1).replace(/^0\./,'.');
        text(densitySvg, ax + 10, y + 4, lab, {anchor:'start', size:11});
      }
    }
    text(densitySvg, ax + 30, Hd / 2, 'θ', {size:18, transform:`rotate(-90 ${ax + 30} ${Hd / 2})`});
    text(densitySvg, (dm.l + ax) / 2, Hd - 7, 'relative frequency', {size:11, fill:'#687076'});
  }

  function drawSampleDensity(){
    drawDensityAxes();
    const ax = densityAxisX();
    const plotW = ax - dm.l;
    const bins = 28;
    const counts = Array(bins).fill(0);
    const draws = chain.slice(1); // do not count the artificial starting value
    draws.forEach(v => {
      const j = Math.min(bins - 1, Math.max(0, Math.floor(v * bins)));
      counts[j] += 1;
    });
    const maxCount = Math.max(1, ...counts);

    // faint target shape, flipped horizontally
    const grid = Array.from({length:220}, (_,i)=>0.001 + i * 0.998 / 219);
    const maxTarget = Math.max(...grid.map(betaUnnorm));
    const upper = grid.map(v => [ax - (betaUnnorm(v)/maxTarget) * plotW, yDen(v)]);
    const dTarget = upper.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') +
      ` L ${ax},${yDen(0.999).toFixed(1)} L ${ax},${yDen(0.001).toFixed(1)} Z`;
    path(densitySvg, dTarget, {fill:'#efefef', stroke:'#c8c8c8', 'stroke-width':1, opacity:0.7});

    // sample bars that fill up as draws accumulate
    for(let j = 0; j < bins; j++){
      const low = j / bins;
      const high = (j + 1) / bins;
      const y1 = yDen(low);
      const y2 = yDen(high);
      const barW = (counts[j] / maxCount) * plotW;
      const rect = el('rect', {
        x: ax - barW,
        y: y2 + 1,
        width: barW,
        height: Math.max(1, y1 - y2 - 2),
        fill:'#6f6f6f',
        opacity: draws.length ? 0.78 : 0
      });
      densitySvg.appendChild(rect);
    }

    const current = chain[chain.length - 1];
    line(densitySvg, dm.l, yDen(current), ax, yDen(current), '#2454d6', 2, {'stroke-dasharray':'4 3'});
    circle(densitySvg, ax, yDen(current), 7, '#2454d6');

    if(last){
      const p = clamp01(last.rawProposal);
      line(densitySvg, dm.l, yDen(p), ax, yDen(p), last.accept ? '#188038' : '#d93025', 2, {'stroke-dasharray':'4 3'});
      circle(densitySvg, ax, yDen(p), 7, last.accept ? '#188038' : '#d93025');
    }
  }

  function drawProposalCurve(cx, current){
    const maxWidth = 85;
    const pts = [];
    for(let i = 0; i < 180; i++){
      const v = Math.max(0, Math.min(1, current - 3 * sigma + i * (6 * sigma / 179)));
      const dens = normalPdf(v, current, sigma);
      const x = cx + dens * maxWidth;
      const y = yChain(v);
      pts.push([x, y]);
    }
    const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    path(chainSvg, d, {stroke:'#111', 'stroke-width':2});
    line(chainSvg, cx, yChain(0), cx, yChain(1), '#222', 1.2);
    line(chainSvg, cx, yChain(current), cx + maxWidth, yChain(current), '#2454d6', 3);
    text(chainSvg, cx + maxWidth + 58, yChain(current) + 5, `N(${current.toFixed(3)}, σ)`, {size:18, fill:'#111'});
  }

  function drawChain(){
    chainSvg.innerHTML = '';
    line(chainSvg, cm.l, cm.t, cm.l, Hc - cm.b, '#333', 1.2);
    line(chainSvg, cm.l, Hc - cm.b, Wc - cm.r, Hc - cm.b, '#333', 1.2);
    for(let k = 0; k <= 10; k++){
      const v = k / 10;
      const y = yChain(v);
      line(chainSvg, cm.l - 4, y, cm.l, y, '#333', 1);
      if(k % 2 === 0 || k === 10){
        const lab = v.toFixed(v === 0 || v === 1 ? 0 : 1).replace(/^0\./,'.');
        text(chainSvg, cm.l - 10, y + 4, lab, {anchor:'end', size:11});
      }
    }
    text(chainSvg, Wc / 2, 16, 'MCMC iteration', {size:16, fill:'#222'});
    text(chainSvg, 14, Hc / 2, 'θ', {size:22, transform:`rotate(-90 14 ${Hc / 2})`});

    if(chain.length > 1){
      const pts = chain.map((v,i)=>[xChain(i), yChain(v)]);
      const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      path(chainSvg, d, {stroke:'#646464', 'stroke-width':1.8, opacity:0.9});
    }

    const current = chain[chain.length - 1];
    const cx = Math.min(Wc - 185, Math.max(cm.l + 75, xChain(chain.length - 1) + 32));
    drawProposalCurve(cx, current);
    circle(chainSvg, xChain(chain.length - 1), yChain(current), 6, '#2454d6');

    if(last){
      const p = clamp01(last.rawProposal);
      const proposalX = cx + 82;
      circle(chainSvg, proposalX, yChain(p), 7, last.accept ? '#188038' : '#d93025');
      line(chainSvg, xChain(chain.length - 2), yChain(last.current), proposalX, yChain(p), last.accept ? '#188038' : '#d93025', 1.5, {'stroke-dasharray':'5 4', opacity:0.75});
    }
  }

  function step(){
    const current = chain[chain.length - 1];
    const proposal = current + randn() * sigma;
    const targetCurrent = betaUnnorm(current);
    const targetProposal = betaUnnorm(proposal);
    const r = targetCurrent === 0 ? 1 : targetProposal / targetCurrent;
    const accProb = Math.min(1, r);
    const u = Math.random();
    const accept = u < accProb;
    if(accept) acceptedCount += 1;
    const stored = accept ? proposal : current;
    chain.push(clamp01(stored));
    last = {current, rawProposal:proposal, r, accProb, u, accept};
    update();
  }

  function updateReadout(){
    const current = chain[chain.length - 1];
    const draws = chain.length - 1;
    const accRate = draws > 0 ? 100 * acceptedCount / draws : 0;
    if(!last){
      readout.innerHTML = `Ready. The chain starts at θ = <b>${current.toFixed(3)}</b>.`;
      return;
    }
    const prop = clamp01(last.rawProposal);
    const colour = last.accept ? '#188038' : '#d93025';
    const verdict = last.accept ? 'accepted' : 'rejected';
    readout.innerHTML = `Proposed θ* = <b style="color:${colour}">${prop.toFixed(3)}</b>. Move ${verdict}. Stored draws: <b>${draws}</b>. Current θ = <b>${current.toFixed(3)}</b>. Acceptance rate: <b>${accRate.toFixed(1)}%</b>.`;
  }

  function update(){drawSampleDensity(); drawChain(); updateReadout();}
  function reset(){chain = [0.5]; last = null; acceptedCount = 0; update();}

  stepBtn.addEventListener('click', step);
  resetBtn.addEventListener('click', reset);
  sdSlider.addEventListener('input', () => {sigma = Number(sdSlider.value); sdVal.textContent = sigma.toFixed(2); update();});
  runBtn.addEventListener('click', () => {
    if(running) return;
    running = true;
    let k = 0;
    const timer = setInterval(() => {
      step(); k += 1;
      if(k >= 50){clearInterval(timer); running = false;}
    }, 55);
  });

  reset();
})();
</script>
</body>
</html>
