project:
  type: book
  output-dir: docs

book:
  title: "QuartoBook"
  author: "Norah Jones"
  date: "28/05/2026"
  chapters:
    - index.qmd
    - intro.qmd
    - summary.qmd
    - apples.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    self-contained: false
    css: 
      - styles.css
      - include/webex.css
    include-after-body: 
      - include/webex.js
    theme:
      light: 
        - flatly
        #- custom.scss
      dark: 
        - darkly
        #- custom.scss
    number-sections: true
  pdf: default

editor: visual

