project:
  type: book
  output-dir: docs

book:
  title: "Statistical Thinking"
  subtitle: ETC2420/5242
  # author: "Minh Huynh"
  # date: "10/29/2025"
  downloads: pdf
  reader-mode: true
  sidebar:
    align: left
    style: floating
    collapse-level: 3
    pinned: true
    
  chapters:
    - index.qmd
    - part: Foundations
      chapters: 
        - Questions.qmd
        - Probability.qmd
        - MeasurementError.qmd
    
    - part: Thinking about Frequentist Uncertainty
      chapters:
        - 4_Estimation.qmd
        - 5_HypothesisTesting.qmd

bibliography: references.bib

format:
  html:
    self-contained: false
    css: 
      - styles.css
      - include/webex.css
    include-after-body: 
      - include/webex.js
    theme:
      light: 
        - flatly
        #- custom.scss
      dark: 
        - darkly
        #- custom.scss
    number-sections: true
  pdf: default

editor: visual

